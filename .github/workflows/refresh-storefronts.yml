name: refresh-storefronts

# Rebuild Storefront Pulse weekly. The pipeline owns its metadata-based cache
# gate, so a scheduled run with an unchanged source avoids the large fetch.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the source-metadata cache and fetch the datasets again.'
        type: boolean
        default: false
  schedule:
    # Sunday at 12:23 UTC, away from the other refresh windows.
    - cron: '23 12 * * 0'

concurrency:
  group: refresh-storefronts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh storefront artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the storefront source cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/storefronts
          key: storefront-source-${{ runner.os }}-${{ hashFiles('scripts/storefronts/*.py') }}-${{ github.run_id }}
          restore-keys: |
            storefront-source-${{ runner.os }}-${{ hashFiles('scripts/storefronts/*.py') }}-
            storefront-source-${{ runner.os }}-

      - name: Rebuild and validate storefront artifacts
        env:
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [ "${FORCE_REFRESH}" = "true" ]; then
            python3 scripts/storefronts/refresh.py --force
          else
            python3 scripts/storefronts/refresh.py
          fi
          python3 scripts/storefronts/validate.py --strict

      - name: Save the storefront source cache
        uses: actions/cache/save@v4
        with:
          path: data/cache/storefronts
          key: storefront-source-${{ runner.os }}-${{ hashFiles('scripts/storefronts/*.py') }}-${{ github.run_id }}

      - name: Detect material change
        id: detect
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          PUBLIC_DIR = "public/data/storefronts"
          METADATA = f"{PUBLIC_DIR}/metadata.json"
          BOUNDARIES = f"{PUBLIC_DIR}/boundaries.geojson"
          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def committed_json(path):
              result = subprocess.run(
                  ["git", "show", f"HEAD:{path}"], capture_output=True, check=False
              )
              if result.returncode:
                  return None
              try:
                  return json.loads(result.stdout.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  fail(f"HEAD:{path} is not valid JSON: {exc}")

          def paths_in(metadata, label):
              if not isinstance(metadata, dict):
                  fail(f"{label} must be a JSON object")
              manifest = metadata.get("periodArtifacts")
              if not isinstance(manifest, list) or not manifest:
                  fail(f"{label} has no periodArtifacts manifest")

              artifacts = {METADATA, BOUNDARIES}
              seen_years = set()
              seen_paths = set()
              for entry in manifest:
                  if not isinstance(entry, dict):
                      fail(f"{label} periodArtifacts entries must be objects")
                  year = entry.get("reportingYear")
                  if not isinstance(year, str) or not re.fullmatch(r"\d{4}(?: and \d{4})?", year):
                      fail(f"{label} has invalid reportingYear {year!r}")
                  if year in seen_years:
                      fail(f"{label} repeats reportingYear {year!r}")
                  seen_years.add(year)

                  slug = year.replace(" ", "-")
                  expected = (
                      ("areas.json", "vacant.geojson")
                      if year == "2024"
                      else (f"periods/{slug}/areas.json", f"periods/{slug}/vacant.geojson")
                  )
                  for key, expected_path in zip(("areasPath", "vacantPath"), expected):
                      path = entry.get(key)
                      if (
                          not isinstance(path, str)
                          or not path
                          or "\\" in path
                          or ":" in path
                          or path.startswith("/")
                          or any(part in ("", ".", "..") for part in path.split("/"))
                      ):
                          fail(f"{label} has unsafe {key} {path!r}")
                      if path != expected_path:
                          fail(f"{label} {key} for {year!r} must be {expected_path!r}")
                      if path in seen_paths:
                          fail(f"{label} repeats artifact path {path!r}")
                      seen_paths.add(path)
                      artifacts.add(f"{PUBLIC_DIR}/{path}")

              if "2024" not in seen_years:
                  fail(f"{label} periodArtifacts is missing the default 2024 cohort")
              return artifacts

          def material(path, value):
              if path == METADATA:
                  value = dict(value)
                  value.pop("contentHash", None)
                  value.pop("retrievedAt", None)
                  source = value.get("source")
                  if isinstance(source, dict):
                      value["source"] = dict(source)
                      value["source"].pop("updatedAt", None)
                  boundaries = value.get("boundarySources")
                  if isinstance(boundaries, list):
                      value["boundarySources"] = [
                          {key: item for key, item in source.items() if key != "updatedAt"}
                          if isinstance(source, dict)
                          else source
                          for source in boundaries
                      ]
              return value

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  fail(f"cannot read validated artifact {path}: {exc}")

          new_metadata = read_json(METADATA)
          new_hash = new_metadata.get("contentHash")
          if not isinstance(new_hash, str) or len(new_hash) != 64:
              fail("storefront metadata has no usable contentHash")
          new_paths = paths_in(new_metadata, "published metadata")
          new_documents = {path: read_json(path) for path in new_paths}

          old_metadata = committed_json(METADATA)
          old_hash = old_metadata.get("contentHash") if old_metadata is not None else None
          old_paths = paths_in(old_metadata, "HEAD metadata") if old_metadata is not None else set()
          material_changed = old_metadata is None or old_paths != new_paths
          if old_metadata is not None:
              for path in old_paths & new_paths:
                  old_document = committed_json(path)
                  if old_document is None:
                      fail(f"HEAD is missing manifest artifact {path}")
                  if material(path, old_document) != material(path, new_documents[path]):
                      material_changed = True
          hash_changed = old_hash != new_hash

          if hash_changed != material_changed:
              fail(
                  "storefront contentHash and timestamp-stripped artifact comparison "
                  "disagree; refusing an ambiguous refresh commit"
              )

          changed = hash_changed
          print(f"- old contentHash: `{old_hash or 'none'}`")
          print(f"- new contentHash: `{new_hash}`")
          print(f"- material artifacts changed: **{str(material_changed).lower()}**")
          print("**Material change detected.**" if changed else "**No material change; timestamp churn will be discarded.**")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
              output.write(f"new_hash={new_hash}\n")
              output.write(f"old_hash={old_hash or 'unknown'}\n")
          PY

      - name: Restore artifacts when nothing changed
        if: steps.detect.outputs.changed == 'false'
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- \
            public/data/storefronts \
            data/processed/storefronts

      - name: Commit and push
        if: steps.detect.outputs.changed == 'true'
        env:
          OLD_HASH: ${{ steps.detect.outputs.old_hash }}
          NEW_HASH: ${{ steps.detect.outputs.new_hash }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/data/storefronts data/processed/storefronts/report.json
          if git diff --cached --quiet; then
            echo "::error::material change detected but no storefront artifact is staged"
            exit 1
          fi

          short="${NEW_HASH:0:7}"
          git commit -m "data: refresh storefronts (hash ${short})" \
            -m "contentHash: ${OLD_HASH} -> ${NEW_HASH}"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
