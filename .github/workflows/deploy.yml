name: deploy

# Three ways in:
#
#   1. push to main             - a human or a merged PR changed code.
#   2. workflow_run            - a data refresh finished successfully.
#                                refresh-data and refresh-walk-data BOTH push
#                                with GITHUB_TOKEN, and a commit pushed by
#                                GITHUB_TOKEN does NOT trigger the `push` event
#                                above (GitHub suppresses workflow runs created
#                                by the default token, to stop recursion).
#                                Without this trigger a data-only commit would
#                                sit on main and never be published. This is
#                                the whole reason it exists. Listing only one of
#                                the two refreshes is a silent failure: the
#                                omitted one's commits land and never deploy.
#   3. workflow_dispatch       - re-deploy by hand, no code change.
#
# A failed refresh-data never reaches here: the guard below requires a
# `success` conclusion, so a broken data commit cannot be deployed.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - refresh-data
      - refresh-walk-data
    types:
      - completed
  workflow_dispatch:

# One Pages deployment at a time. GitHub Pages only serves one deployment at a
# time, and the official starter workflow uses the same group name. Cancelling
# an in-flight deploy is NOT wanted: a half-finished upload would be worse than
# a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Restated rather than inherited, so the one place the extra scope is
    # granted is visible in a diff. actions/configure-pages needs `pages: write`
    # and `id-token: write` to enable the site; nothing else in this job does,
    # and this job never pushes to the repository.
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # On workflow_run the default ref is the default branch, which may
          # already have moved past the commit refresh-data validated. Pin the
          # build to the exact SHA that workflow ran on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # persist-credentials is unnecessary here: this job never pushes.

      # A Pages site is a persistent REPOSITORY-LEVEL resource. It is not created
      # by this workflow, and - verified, see below - it cannot be.
      #
      # `actions/configure-pages` takes an `enablement` input that reads like it
      # creates the site for you. It does not. That input calls
      # `POST /repos/{owner}/{repo}/pages` with this job's GITHUB_TOKEN, and the
      # Actions integration is not permitted to call it. On a repo with no Pages
      # site the step dies with:
      #
      #     Create Pages site failed. Error: Resource not accessible by
      #     integration - https://docs.github.com/rest/pages/pages#create-a-...
      #
      # "Resource not accessible by integration" is the error you get when the
      # TOKEN lacks the scope, so it reads like a permissions bug in this file
      # and sends you auditing `permissions:` - which are already correct and
      # byte-for-byte match the official Pages starter workflow. A PAT with
      # `repo` scope gets past it and then reports the real reason plainly
      # ("Your current plan does not support GitHub Pages for this repository"),
      # which is how the two distinct causes get confused for each other.
      #
      # So: `enablement` is not passed, and the one-time setup is done by hand.
      # It has to be - a PAT with `repo` scope would work, but minting a
      # broad-scope credential and storing it in the repo to avoid clicking
      # "Pages > Build and deployment > GitHub Actions" once is a bad trade. The
      # site is a durable resource that does not rot; nothing re-creates it
      # because nothing needs to.
      #
      # The guard below exists purely to convert the opaque 403 above into an
      # error that names its own fix. It cannot make the missing site appear.
      - name: Require an existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GET is permitted for the integration token; only create is not, so a
          # 404 here means "no site yet" rather than "not allowed to look".
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            cat >&2 <<'MSG'
          ::error::GitHub Pages is not enabled for this repository, so there is
          nothing to deploy to. This is a one-time setup step that no workflow
          can do for you: the GITHUB_TOKEN is not permitted to create a Pages
          site, which is why the `enablement` input on actions/configure-pages
          does not help.

          Enable it once, as an admin:
            gh api --method POST repos/<owner>/<repo>/pages -f build_type=workflow
          or Settings > Pages > Build and deployment > Source: GitHub Actions.

          If it is already enabled, the site may still be mid-build; re-run this
          workflow. Note that a private repository needs a paid plan before
          GitHub Pages will serve it at all.
          MSG
            exit 1
          fi
          echo "Pages site present for ${GITHUB_REPOSITORY}."

      # Reads the Pages config and publishes the platform's own base path. Safe
      # to run on an existing site; it changes no repository settings.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------------------------------
      # Base path for repository-subpath hosting.
      #
      # GitHub Pages serves a project site at
      #   https://<owner>.github.io/<repo>/
      # so a Vite build with base "/" would emit /assets/index-abc.js, which
      # 404s, and would make import.meta.env.BASE_URL = "/". src/data/load.ts
      # builds its fetch URLs from BASE_URL, so the GeoJSON would 404 too.
      #
      # We derive the base from the repository name at run time and pass it as
      # VITE_BASE_PATH, which vite.config.ts already reads. A fork named
      # eat-outside-nyc-fork therefore deploys correctly with nobody editing a
      # single file. Nothing is hard-coded to the upstream repository name.
      #
      # "/<repo>/" rather than "./":
      #   * "./" happens to work for this single-page app served from the
      #     directory root, because every asset sits one level down. It breaks
      #     the moment the document URL has a different depth - a redirect to
      #     /index.html, a nested route, or a served subdirectory.
      #   * An absolute "/<repo>/" is unambiguous for both the emitted asset
      #     URLs and BASE_URL-derived fetches, at any document depth.
      #   * The one case where "/" is correct is an owner/org Pages site, whose
      #     repository is named <owner>.github.io and is served at the domain
      #     root. That case is handled explicitly below.
      #
      # configure-pages also publishes the platform's own answer as
      # `steps.pages.outputs.base_path`. It is logged below for comparison but
      # deliberately not used as the source of truth: the repository name is
      # deterministic, works identically for a fork, and does not depend on an
      # API call having succeeded.
      # ---------------------------------------------------------------------
      - name: Resolve the Pages base path
        id: base
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [ "$repo" = "${owner}.github.io" ]; then
            base="/"
          else
            base="/${repo}/"
          fi
          echo "base=${base}" >>"${GITHUB_OUTPUT}"
          {
            echo "### deploy"
            echo
            echo "- repository: \`${GITHUB_REPOSITORY}\`"
            echo "- \`VITE_BASE_PATH\` = \`${base}\`"
            echo "- configure-pages \`base_path\` = \`${{ steps.pages.outputs.base_path || '(not reported)' }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "VITE_BASE_PATH=${base}"

      - name: Set up Node 20.19
        uses: actions/setup-node@v4
        with:
          # Satisfies engines.node ">=20.19" in package.json. Pinned so a
          # toolchain bump shows up as a diff in this file.
          node-version: '20.19.0'
          # Caches ~/.npm keyed on package-lock.json, so npm ci is a no-op
          # tarball extraction on most runs.
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Lint
        run: |
          set -euo pipefail
          npm run lint

      - name: Unit tests
        run: |
          set -euo pipefail
          npm test

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          npm run build

      # npm run build writes dist/. Make it the artifact, not a side effect.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a successful build is deployable...
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # ...and GitHub also requires this to be exactly true.
    permissions:
      pages: write
      id-token: write
    # The Pages environment is what enables the deployment, and the URL it
    # reports is the link shown in the run summary.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
